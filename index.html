<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みかん・アイ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="icon" href="icon.png">
    
</head>
<body>

    <header id="main-header">
        <img src="icon.png" class="header-icon-left" alt="左のアイコン">
        <h1>みかん・アイ</h1>
        <p id="header-desc">あなたのみかん画像から評価します！</p>
    </header>

    <main>
        <div class="controls-card">
            <div class="mode-switch">
                <span class="switch-label">鑑定士版</span>
                <label class="toggle-switch">
                    <input type="checkbox" class="toggle-checkbox" id="veteran-mode">
                    <div class="toggle-slot">
                        <div class="toggle-button"></div>
                    </div>
                </label>
                <span class="switch-label">✨ベテラン農家版</span>
            </div>
            
            <p id="mode-description" style="text-align: center; color: #e67e00; font-size: 0.9rem; margin-bottom: 1.5rem; min-height: 1.5em; font-weight: bold;">
                標準語で丁寧に鑑定結果をお伝えします。
            </p>

            <div class="input-methods">
                <label for="file-upload" class="btn btn-outline">
                    📁 アルバムから
                </label>
                <input type="file" id="file-upload" class="file-input" accept="image/*">
                
                <button id="start-camera" class="btn btn-primary">
                    📷 カメラ起動
                </button>
            </div>
        </div>

        <div id="preview-container">
            <p id="placeholder-text" style="color: #999;">ここに画像が表示されます</p>
            <img id="image-preview" alt="Preview">
            <video id="video-preview" autoplay playsinline muted></video>
            
            <div style="margin-top: 1.5rem;">
                <button id="capture-btn" class="btn btn-primary hidden">📸 撮影する</button>
                <button id="retake-btn" class="btn btn-outline hidden">🔄 撮り直す</button>
                <button id="analyze-btn" class="btn btn-primary hidden">🍊 鑑定する</button>
            </div>
        </div>

        <div id="result-area"></div>
    </main>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="trivia-card">
            <div class="trivia-title">🍊 みかん 豆知識</div>
            <p id="trivia-text" class="trivia-content">読み込み中...</p>
        </div>
    </div>

    <footer>
        &copy; 2025 duck_ahiru_Z
    </footer>

    <script src="script.js"></script>
</body>
</html>
